name: ScentFlow CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/payment-inventory-safety]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scentflow-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scentflow-backend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scentflow-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scentflow-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: test-client-key
